<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Доска публикаций</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Доска публикаций</h1>

    <!-- Кнопка загрузки -->
    <div class="toolbar">
      <button id="loadBtn" type="button">Загрузить публикации</button>
    </div>

    <!-- Область сообщений (загрузка, успех, ошибки) -->
    <div id="messageArea" class="message-area" role="status" aria-live="polite"></div>

    <!-- Список публикаций -->
    <section class="posts-section">
      <h2>Публикации</h2>
      <div id="postsList" class="posts-list"></div>
    </section>

    <!-- Форма создания публикации -->
    <section class="form-section">
      <h2>Создать публикацию</h2>
      <form id="postForm" novalidate>
        <div class="form-group">
          <label for="titleInput">Заголовок</label>
          <input type="text" id="titleInput" name="title" placeholder="Введите заголовок">
        </div>

        <div class="form-group">
          <label for="bodyInput">Текст</label>
          <textarea id="bodyInput" name="body" rows="4" placeholder="Введите текст публикации"></textarea>
        </div>

        <button id="createBtn" type="submit">Создать публикацию</button>
      </form>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
